<!doctype html>

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>PIKI - indie band from Prague</title>
<meta name="description" content="PIKI - indie rock trio from Prague. All our links in one place.">
<!-- DEFAULT META TAGS -->

<!-- FONTS -->
<link href='https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,800&subset=latin,latin-ext' rel='stylesheet' type='text/css'>

<style>
	:root{
		--overlay: rgba(10,7,5,0.6);
		--card-bg: rgba(18,13,10,0.55);
		--card-border: rgba(255,255,255,0.14);
		--text: #ffffff;
		--text-dim: rgba(255,255,255,0.78);
		--accent: #f2b705;
		padding-top: env(safe-area-inset-top, 0px);
		padding-bottom: env(safe-area-inset-bottom, 0px);
	}

	*{ box-sizing: border-box; }

	html{
		margin: 0;
		min-height: 100%;
		background: #12100e;
	}

	body{
		margin: 0;
		background: transparent;
		font-family: 'Open Sans', Arial, sans-serif;
		color: var(--text);
		min-height: 100dvh;
		display: flex;
		align-items: center;
		justify-content: center;
		padding: 40px 16px;
	}

	.bg{
		position: fixed;
		inset: 0;
		z-index: -2;
		overflow: hidden;
	}

	.bg img{
		width: 100%;
		height: 100%;
		object-fit: cover;
		object-position: left top;
		display: block;
	}

	.bg::after{
		content: "";
		position: absolute;
		inset: 0;
		background: var(--overlay);
	}

	.linktree{
		width: 100%;
		max-width: 480px;
		text-align: center;
	}

	.avatar{
		width: 108px;
		height: 108px;
		border-radius: 50%;
		object-fit: cover;
		border: 3px solid rgba(255,255,255,0.85);
		box-shadow: 0 4px 18px rgba(0,0,0,0.45);
		margin: 0 auto 18px;
		display: block;
	}

	h1.bandname{
		font-size: 30px;
		font-weight: 800;
		letter-spacing: 0.08em;
		margin: 0 0 6px;
		text-shadow: 0 2px 10px rgba(0,0,0,0.55);
	}

	p.tagline{
		margin: 0 0 30px;
		font-weight: 300;
		color: var(--text-dim);
		font-size: 15px;
		letter-spacing: 0.02em;
		text-shadow: 0 1px 6px rgba(0,0,0,0.5);
	}

	.links{
		list-style: none;
		margin: 0;
		padding: 0;
		display: flex;
		flex-direction: column;
		gap: 14px;
	}

	.links a{
		display: flex;
		align-items: center;
		gap: 14px;
		padding: 15px 20px;
		background: var(--card-bg);
		border: 1px solid var(--card-border);
		border-radius: 14px;
		color: var(--text);
		text-decoration: none;
		font-weight: 600;
		font-size: 16px;
		backdrop-filter: blur(6px);
		-webkit-backdrop-filter: blur(6px);
		transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
	}

	.links a:hover,
	.links a:focus-visible{
		background: rgba(242,183,5,0.18);
		border-color: var(--accent);
		transform: translateY(-2px);
	}

	.links a:active{
		transform: translateY(0);
	}

	.icon{
		flex: 0 0 auto;
		width: 38px;
		height: 38px;
		border-radius: 50%;
		display: flex;
		align-items: center;
		justify-content: center;
		background: rgba(255,255,255,0.12);
	}

	.icon svg{
		width: 19px;
		height: 19px;
		fill: none;
		stroke: #ffffff;
		stroke-width: 2;
		stroke-linecap: round;
		stroke-linejoin: round;
	}

	.icon svg.filled{
		stroke: none;
		fill: #ffffff;
	}

	.label{
		flex: 1 1 auto;
		text-align: left;
	}

	footer{
		margin-top: 34px;
		font-size: 12px;
		color: var(--text-dim);
		text-shadow: 0 1px 6px rgba(0,0,0,0.5);
	}

	footer a{
		color: var(--text-dim);
	}

	@media (min-width: 600px){
		.bg img{ object-position: left top; }
	}
</style>

</head>
